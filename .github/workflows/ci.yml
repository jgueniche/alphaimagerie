# Qualité (§4 et §13 du brief) : lint, types, garde-fous contenu, build SSG,
# suite Playwright (navigation, CTA, 301, 0 requête tierce, formulaire, axe-core),
# puis Lighthouse CI mobile sur les gabarits types.
name: CI

on:
  push:
    branches: [master, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Garde-fou « À CONFIRMER » (strict)
        run: CHECK_CONFIRMER=strict node scripts/check-confirmer.mjs
      - name: Similarité de contenu
        run: node scripts/check-similarity.mjs
      - name: Région d'exécution UE (config)
        run: node scripts/check-region.mjs
      - run: npm run build
      - name: Données structurées (§13 — 5 types, 0 erreur)
        run: node scripts/check-jsonld.mjs
      - name: SEO on-page (§13 — title/description/OG/canonical uniques)
        run: node scripts/check-seo.mjs
      - name: Validation HTML (§13 — 0 erreur bloquante)
        run: npm run check:html
      - name: Navigateurs Playwright
        run: npx playwright install --with-deps chromium
      - name: Tests E2E
        run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: qualite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lighthouse CI (mobile, seuils §13)
        run: npx --yes @lhci/cli@0.14.x autorun
